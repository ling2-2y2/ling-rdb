name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:dts
      - name: dist 运行时符号断言
        run: >
          node -e "import('./dist/index.js').then(m => {
            for (const k of ['default','Rdb','RdbDatabaseRegistry','RdbError','migrateRdb','numberedPlaceholders','upsertSql','buildRdbListQuery','rdbDatabaseServiceKey','BaseMapper','defineTable','toSqlDateTime'])
              if (!m[k]) throw new Error('missing ' + k);
            console.log('dist symbols OK');
          })"
      - run: pnpm smoke
